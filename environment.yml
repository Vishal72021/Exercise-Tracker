# Conda Environment Setup Instructions
#  - Using an environment.yml file with conda
#  - Key Terminal Commands:
#
#    conda env create -f environment.yml
#    conda env update --file environment.yml --prune
#    conda env export --name barbell-exercise-tracker > environment.yml
#    conda env remove --name barbell-exercise-tracker
#    conda env list

name: barbell-exercise-tracker
channels:
  - anaconda
  - conda-forge
  - defaults
dependencies:
  - python=3.13.9
  - pip
  - bottleneck
  - pip:
      - numpy==2.4.5
      - pandas==3.0.3
      - ipykernel==7.2.0
      - ipython==9.13.0
      - jupyter-client==8.8.0
      - jupyter-core==5.9.1
      - matplotlib==3.10.9

